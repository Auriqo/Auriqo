name: Propose player config updates

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Fetch latest player configs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/ZemerTeam/zemer-cipher/master/library/src/main/assets/player_configs.json" \
            -o /tmp/player_configs_new.json
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/ZemerTeam/zemer-cipher/master/player_dates.json" \
            -o /tmp/player_dates_new.json
          jq empty /tmp/player_configs_new.json
          jq empty /tmp/player_dates_new.json

      - name: Compare and stage changes
        id: check_sync
        shell: bash
        run: |
          set -euo pipefail
          changed=false

          if ! cmp -s app/src/main/assets/player_configs.json /tmp/player_configs_new.json; then
            cp /tmp/player_configs_new.json app/src/main/assets/player_configs.json
            changed=true
          fi

          if ! cmp -s app/src/main/assets/player_dates.json /tmp/player_dates_new.json; then
            cp /tmp/player_dates_new.json app/src/main/assets/player_dates.json
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Open a review pull request
        if: steps.check_sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update player configs from upstream"
          title: "chore: update player configs from upstream"
          body: |
            This automated pull request contains the latest player configuration
            files from ZemerTeam/zemer-cipher. Review the diff and run the normal
            FOSS checks before merging.
          branch: automation/player-configs
          delete-branch: true
          draft: true
