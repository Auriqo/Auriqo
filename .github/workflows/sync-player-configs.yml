name: Propose player configuration updates

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Validate and propose cipher configuration update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Fetch and validate player_configs.json
        shell: bash
        run: |
          curl --fail --location --show-error --silent --retry 3 --retry-all-errors --retry-delay 2 \
            'https://raw.githubusercontent.com/ZemerTeam/zemer-cipher/master/library/src/main/assets/player_configs.json' \
            --output /tmp/player_configs.json
          jq -e '
            type == "object" and .schemaVersion == 1 and
            (.players | type == "object" and length > 0) and
            all(.players | to_entries[];
              (.key | test("^[a-f0-9]{8}$")) and
              (.value | type == "object" and
                (.sig | type == "string" and test("^[A-Za-z0-9$_]{1,8}\\([0-9]+,[0-9]+,INPUT\\)$")) and
                (.nClass | type == "string" and test("^[A-Za-z0-9$_]{1,8}$")) and
                (.sts | type == "number" and . > 0 and floor == .) and
                ((.aliases? // []) | type == "array" and all(.[]; type == "string" and test("^[a-f0-9]{8}$")))
              )
            ) and
            ([.players | to_entries[] | (.key, (.value.aliases[]?))] | length == (unique | length))
          ' /tmp/player_configs.json

      - name: Stage validated changes
        shell: bash
        run: |
          install -m 0644 /tmp/player_configs.json app/src/main/assets/player_configs.json

      - name: Create or update review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/sync-player-configs
          delete-branch: true
          commit-message: 'chore: update player configs from upstream zemer-cipher'
          title: 'chore: update player configs from upstream zemer-cipher'
          body: |
            This automated proposal fetched the upstream player configuration assets.

            The player configuration file passed the repository's JSON/schema validation before this pull request was created. Review the diff before merging; this workflow never pushes directly to `main`.
          labels: automation
