name: Android validation and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to validate/publish (required only when publish is enabled)
        required: false
        type: string
      publish:
        description: Create a signed GitHub release after validation (requires release signing secrets)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate FOSS debug build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cap Gradle resources for hosted runner
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          # Leave headroom for Android build tools and the managed-device emulator.
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx1536m
          org.gradle.workers.max=2
          EOF

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-foss-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-foss-
            ${{ runner.os }}-gradle-

      - name: Configure Android SDK path
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Create disposable Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate FOSS and GMS variants
        timeout-minutes: 45
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:assembleUniversalFossDebug \
            :app:testUniversalFossDebugUnitTest \
            :app:lintUniversalFossDebug \
            :app:assembleUniversalGmsDebug \
            :app:testUniversalGmsDebugUnitTest \
            :app:lintUniversalGmsDebug

      - name: Run Universal FOSS Compose smoke tests on Gradle Managed Device
        timeout-minutes: 30
        shell: bash
        run: |
          # aosp-atd is headless and disables hardware rendering by design.
          ./gradlew --no-daemon \
            :app:auriqoApi30UniversalFossDebugAndroidTest

      - name: Upload FOSS instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auriqo-foss-instrumentation-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload FOSS debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auriqo-foss-debug-${{ github.run_number }}
          path: app/build/outputs/apk/universalFoss/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  release-candidate:
    name: Build unsigned FOSS release candidate
    needs: validate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cap Gradle resources for hosted runner
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          # Leave headroom for Android build tools and the managed-device emulator.
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx1536m
          org.gradle.workers.max=2
          EOF

      - name: Configure Android SDK path
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Build unsigned FOSS universal release candidate APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:assembleUniversalFossRelease

      - name: Stage unsigned universal release candidate APK, enforce size budget, and checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf release-artifacts
          mkdir -p release-artifacts
          apks=(app/build/outputs/apk/universalFoss/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one unsigned FOSS universal release APK, found ${#apks[@]}."
            exit 1
          fi
          max_bytes=$((200 * 1024 * 1024))
          size_bytes=$(stat -c '%s' "${apks[0]}")
          if [ "$size_bytes" -gt "$max_bytes" ]; then
            echo "::error::Universal release APK is $size_bytes bytes; limit is $max_bytes bytes."
            exit 1
          fi
          cp "${apks[0]}" release-artifacts/auriqo-foss-universal.apk
          (cd release-artifacts && sha256sum auriqo-foss-universal.apk > SHA256SUMS)
          ls -lh release-artifacts

      - name: Upload unsigned release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auriqo-foss-release-candidate-unsigned-${{ github.run_number }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Sign and publish release
    needs: [validate, release-candidate]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cap Gradle resources for hosted runner
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          # Leave headroom for Android build tools and the managed-device emulator.
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx1536m
          org.gradle.workers.max=2
          EOF

      - name: Configure Android SDK path
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Publication requires an existing version tag such as v1.0.0."
            exit 1
          fi

      - name: Verify release signing configuration
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for variable in RELEASE_KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Required release signing secret $variable is not configured."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Materialize release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore

      - name: Build signed FOSS universal release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PrequireReleaseSigning=true \
            :app:assembleUniversalFossRelease

      - name: Stage signed universal release APK, enforce size budget, and checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf release-artifacts
          mkdir -p release-artifacts
          apks=(app/build/outputs/apk/universalFoss/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed FOSS universal release APK, found ${#apks[@]}."
            exit 1
          fi
          max_bytes=$((200 * 1024 * 1024))
          size_bytes=$(stat -c '%s' "${apks[0]}")
          if [ "$size_bytes" -gt "$max_bytes" ]; then
            echo "::error::Universal release APK is $size_bytes bytes; limit is $max_bytes bytes."
            exit 1
          fi
          cp "${apks[0]}" release-artifacts/auriqo-foss-universal.apk
          (cd release-artifacts && sha256sum auriqo-foss-universal.apk > SHA256SUMS)
          ls -lh release-artifacts

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auriqo-foss-release-signed-${{ github.run_number }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Verify release notes match the release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          expected="# Auriqo ${RELEASE_TAG}"
          actual=$(head -n 1 RELEASE_INFO.md)
          if [ "$actual" != "$expected" ]; then
            echo "::error::RELEASE_INFO.md must start with '$expected' before publishing."
            exit 1
          fi
          if grep -q '^PENDING:' RELEASE_INFO.md; then
            echo "::error::RELEASE_INFO.md contains unresolved PENDING release gates."
            exit 1
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Auriqo $RELEASE_TAG" \
            --notes-file RELEASE_INFO.md \
            release-artifacts/*
